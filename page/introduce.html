<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragonBallFilm · 数据库</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="icon" href="../imgs/weblogo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           史考特 v5.2 · 大尺寸版 · 支持状态保持
           ============================================================ */

        /* ----- 全局变量 ----- */
        :root {
            --bg-primary: #0a0e0a;
            --bg-card: #0f140f;
            --green-primary: #00ff41;
            --green-dim: #00cc33;
            --green-glow: rgba(0, 255, 65, 0.08);
            --border-color: #1a3a1a;
            --text-primary: #b0ffb0;
            --text-dim: #558855;
            --text-muted: #3a6a3a;
            --font-mono: 'Share Tech Mono', 'Courier New', monospace;
            --card-radius: 0.85rem;
            --gap: 1rem;
            --sidebar-width: 14rem;
        }

        /* ----- 重置内容区域 ----- */
        .search,
        .main,
        .pagination {
            all: unset;
            display: block;
        }

        /* 全局扫描线 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 255, 65, 0.010) 2px,
                    rgba(0, 255, 65, 0.010) 4px);
            z-index: 9999;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green-primary), transparent);
            opacity: 0.06;
            z-index: 9998;
            animation: scanMove 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: -0.3125rem; opacity: 0; }
            10% { opacity: 0.10; }
            90% { opacity: 0.10; }
            100% { top: 100%; opacity: 0; }
        }

        /* ----- ★ 主容器 ----- */
        .scouter-container {
            width: calc(100% - 16rem);
            max-width: 1600px;
            margin-left: 16rem;
            margin-right: 1rem;
            margin-top: 6rem;
            margin-bottom: 1.25rem;
            padding: 1.5rem 2rem 1.25rem;
            background: rgba(10, 14, 10, 0.92);
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.25rem;
            box-shadow: 0 0 5rem rgba(0, 255, 65, 0.03), inset 0 0 5rem rgba(0, 255, 65, 0.015);
            backdrop-filter: blur(2px);
            transition: border-color 0.4s;
            position: relative;
        }

        .scouter-container:hover {
            border-color: rgba(0, 255, 65, 0.15);
        }

        @media (max-width: 48rem) {
            .scouter-container {
                width: calc(100% - 4.5rem);
                margin-left: 4.5rem;
                margin-right: 0.5rem;
                padding: 1rem 1rem 0.75rem;
                border-radius: 1rem;
            }
        }

        @media (max-width: 30rem) {
            .scouter-container {
                width: calc(100% - 3.5rem);
                margin-left: 3.5rem;
                margin-right: 0.25rem;
                padding: 0.75rem 0.75rem 0.625rem;
                border-radius: 0.75rem;
            }
        }

        /* ----- 史考特头部 ----- */
        .scouter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 1rem;
            border-bottom: 0.0625rem solid var(--border-color);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .scouter-brand {
            display: flex;
            align-items: baseline;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .scouter-brand .logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--green-primary);
            text-shadow: 0 0 2rem var(--green-glow), 0 0 5rem rgba(0, 255, 65, 0.06);
            letter-spacing: 0.25rem;
        }

        .scouter-brand .logo span {
            color: var(--text-dim);
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 0.0625rem;
        }

        .scouter-brand .sub {
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 0.125rem;
            padding-left: 0.75rem;
            border-left: 0.0625rem solid var(--border-color);
        }

        .scouter-status {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }

        .scouter-status .dot {
            display: inline-block;
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: var(--green-primary);
            box-shadow: 0 0 0.875rem var(--green-primary);
            animation: pulse-dot 1.8s ease-in-out infinite;
            margin-right: 0.25rem;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.7); }
        }

        .scouter-status .stat-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .scouter-status .stat-item .label { color: var(--text-dim); }
        .scouter-status .stat-item .value { color: var(--green-primary); }

        /* ----- 搜索栏 ----- */
        .search {
            width: 100% !important;
            height: auto !important;
            padding: 0 0 1.25rem 0 !important;
            background: transparent !important;
            display: flex !important;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-left: 0 !important;
        }

        .search #searchInput {
            flex: 1;
            min-width: 14rem;
            padding: 0.6rem 1.5rem;
            border: 0.0625rem solid var(--border-color);
            border-radius: 1.75rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: rgba(0, 255, 65, 0.02);
            color: var(--text-primary);
            font-family: var(--font-mono);
            letter-spacing: 0.03125rem;
            height: 2.8rem;
        }

        .search #searchInput:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 2rem rgba(0, 255, 65, 0.04);
            background: rgba(0, 0, 0, 0.6);
        }

        .search #searchInput::placeholder {
            color: var(--text-dim);
            font-size: 0.85rem;
            letter-spacing: 0.03125rem;
        }

        .search #searchResultCount {
            font-size: 0.85rem;
            color: var(--text-dim);
            white-space: nowrap;
            letter-spacing: 0.03125rem;
            font-weight: 400;
            padding: 0.25rem 0.75rem;
            border: 0.0625rem solid transparent;
        }

        /* ----- ★ 卡片网格：一行5个 ----- */
        .main {
            padding: 0 !important;
            display: grid !important;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--gap);
            margin: 0 !important;
            min-height: 20rem;
        }

        @media (max-width: 75rem) { .main { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 62rem) { .main { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 48rem) { .main { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
        @media (max-width: 30rem) { .main { grid-template-columns: 1fr 1fr; gap: 0.6rem; } }
        @media (max-width: 420px) { .main { grid-template-columns: 1fr; gap: 0.8rem; } }

        /* ----- ★ 史考特卡片 ----- */
        .charbox {
            background: var(--bg-card);
            border: 0.0625rem solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 0.8rem 0.9rem 0.7rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            opacity: 0;
            animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex !important;
            flex-direction: column;
            width: 100% !important;
            margin: 0 !important;
            min-height: 14rem;
        }

        .charbox:nth-child(1) { animation-delay: 0.02s; }
        .charbox:nth-child(2) { animation-delay: 0.04s; }
        .charbox:nth-child(3) { animation-delay: 0.06s; }
        .charbox:nth-child(4) { animation-delay: 0.08s; }
        .charbox:nth-child(5) { animation-delay: 0.10s; }
        .charbox:nth-child(6) { animation-delay: 0.12s; }
        .charbox:nth-child(7) { animation-delay: 0.14s; }
        .charbox:nth-child(8) { animation-delay: 0.16s; }
        .charbox:nth-child(9) { animation-delay: 0.18s; }
        .charbox:nth-child(10) { animation-delay: 0.20s; }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(0.75rem) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .charbox::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0.125rem;
            background: linear-gradient(90deg, transparent, var(--green-primary), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .charbox:hover {
            border-color: rgba(0, 255, 65, 0.30);
            transform: translateY(-0.3rem);
            box-shadow: 0 0.8rem 3rem rgba(0, 0, 0, 0.6), 0 0 3rem rgba(0, 255, 65, 0.03);
        }

        .charbox:hover::before { opacity: 1; }
        .charbox:active { transform: scale(0.97); filter: brightness(0.85); }

        /* 卡片顶部 */
        .charbox .card-top {
            display: flex;
            align-items: flex-start;
            gap: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .charbox .charimg {
            width: 3.6rem;
            height: 4.8rem;
            flex-shrink: 0;
            border-radius: 0.4rem;
            overflow: hidden;
            border: 0.125rem solid rgba(0, 255, 65, 0.06);
            box-shadow: 0 0 0 0.125rem rgba(0, 255, 65, 0.03), 0 0 1.5rem rgba(0, 255, 65, 0.03);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            background: #1a1f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 3 / 4;
            image-rendering: pixelated;
        }

        .charbox:hover .charimg {
            transform: scale(1.05);
            box-shadow: 0 0 0 0.125rem rgba(0, 255, 65, 0.12), 0 0 3rem rgba(0, 255, 65, 0.05);
        }

        .charbox .charimg img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .charbox .charimg .ring {
            position: absolute;
            inset: -0.25rem;
            border-radius: 0.4rem;
            border: 0.0625rem solid rgba(0, 255, 65, 0.05);
            animation: spin-ring 14s linear infinite;
            pointer-events: none;
        }

        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 名称区域 */
        .charbox .card-name-group {
            flex: 1;
            min-width: 0;
            overflow: visible;
        }

        .charbox .card-name-group .name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.03125rem;
            line-height: 1.3;
            white-space: normal;
            word-break: break-word;
            overflow: visible;
            text-overflow: clip;
        }

        .charbox .card-name-group .film-tag {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.03125rem;
            margin-top: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .charbox .card-name-group .saga-tag {
            display: inline-block;
            margin-top: 0.15rem;
            font-size: 0.65rem;
            padding: 0.05rem 0.7rem;
            border-radius: 0.7rem;
            border: 0.0625rem solid var(--border-color);
            color: var(--text-dim);
            letter-spacing: 0.01875rem;
            background: rgba(0, 255, 65, 0.03);
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 详情 */
        .charbox .card-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.1rem 0.7rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.3rem;
            flex: 1;
        }

        .charbox .card-details .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 0.15rem 0;
            border-bottom: 0.0625rem solid rgba(0, 255, 65, 0.015);
            min-width: 0;
            gap: 0.3rem;
            align-items: baseline;
        }

        .charbox .card-details .detail-item .label {
            color: var(--text-dim);
            letter-spacing: 0.01875rem;
            flex-shrink: 0;
            font-size: 0.7rem;
        }

        .charbox .card-details .detail-item .value {
            color: var(--text-primary);
            font-weight: 400;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
            font-size: 0.7rem;
        }

        /* 底部 */
        .charbox .card-footer {
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 0.0625rem solid rgba(0, 255, 65, 0.035);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 0.03125rem;
        }

        .charbox .card-footer .scan-tag {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .charbox .card-footer .scan-tag .blink {
            display: inline-block;
            width: 0.3rem;
            height: 0.3rem;
            border-radius: 50%;
            background: var(--green-primary);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .charbox .card-footer .id-tag {
            color: var(--text-dim);
            font-size: 0.6rem;
        }

        /* ----- 分页 ----- */
        .pagination {
            display: flex !important;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            padding: 1.25rem 0 0.25rem !important;
            flex-wrap: wrap;
            border-top: 0.0625rem solid var(--border-color);
            margin-left: 0 !important;
            margin-top: 1.25rem;
        }

        .pagination button {
            padding: 0.4rem 1.1rem !important;
            border: 0.0625rem solid var(--border-color) !important;
            background: transparent !important;
            color: var(--text-dim) !important;
            font-family: var(--font-mono) !important;
            font-size: 0.85rem !important;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 1.5rem !important;
            letter-spacing: 0.03125rem;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--green-primary) !important;
            color: var(--green-primary) !important;
            background: rgba(0, 255, 65, 0.04) !important;
            box-shadow: 0 0 1.25rem rgba(0, 255, 65, 0.04);
        }

        .pagination button:disabled { opacity: 0.25 !important; cursor: not-allowed; }

        .pagination button.active-page {
            background: rgba(0, 255, 65, 0.08) !important;
            border-color: var(--green-primary) !important;
            color: var(--green-primary) !important;
            font-weight: 600 !important;
        }

        .pagination .page-info {
            font-size: 0.85rem !important;
            color: var(--text-dim) !important;
            padding: 0 0.5rem !important;
            letter-spacing: 0.03125rem;
            background: transparent !important;
        }

        .pagination .page-ellipsis {
            color: var(--text-dim) !important;
            padding: 0 0.25rem !important;
            font-size: 0.85rem !important;
        }

        /* ----- 空状态 ----- */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1.5rem;
            color: var(--text-dim);
            font-size: 1rem;
            letter-spacing: 0.0625rem;
            border: 0.0625rem dashed var(--border-color);
            border-radius: var(--card-radius);
            background: rgba(0, 255, 65, 0.01);
        }

        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            opacity: 0.25;
        }

        /* ----- 底部状态 ----- */
        .scouter-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 1rem;
            border-top: 0.0625rem solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-dim);
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 0.4rem;
        }

        .scouter-footer .right {
            display: flex;
            gap: 1.25rem;
            align-items: center;
        }

        .scouter-footer .right .badge {
            padding: 0.15rem 1rem;
            border-radius: 0.8rem;
            background: rgba(0, 255, 65, 0.05);
            border: 0.0625rem solid rgba(0, 255, 65, 0.06);
            color: var(--green-primary);
            font-size: 0.7rem;
            letter-spacing: 0.03125rem;
        }

        /* 响应式 */
        @media (max-width: 48rem) {
            .scouter-header { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .scouter-brand .logo { font-size: 1.6rem; }
            .scouter-brand .sub { font-size: 0.75rem; padding-left: 0; border-left: none; }
            .scouter-status { font-size: 0.7rem; gap: 0.75rem; }
            .search { flex-direction: column; align-items: stretch; }
            .search #searchInput { min-width: unset; font-size: 0.9rem; height: 2.5rem; padding: 0.5rem 1.2rem; }
            .charbox { min-height: 12rem; padding: 0.6rem 0.7rem 0.5rem; }
            .charbox .charimg { width: 2.8rem; height: 3.7rem; }
            .charbox .card-name-group .name { font-size: 0.95rem; }
            .charbox .card-details { font-size: 0.65rem; gap: 0.0625rem 0.4rem; }
            .charbox .card-details .detail-item .label { font-size: 0.6rem; }
            .charbox .card-details .detail-item .value { font-size: 0.6rem; }
            .pagination { gap: 0.4rem; }
            .pagination button { padding: 0.25rem 0.8rem !important; font-size: 0.75rem !important; }
            .scouter-footer { flex-direction: row; justify-content: center; gap: 0.4rem; font-size: 0.7rem; }
        }

        @media (max-width: 30rem) {
            .scouter-container { padding: 0.6rem 0.5rem 0.5rem; }
            .scouter-brand .logo { font-size: 1.2rem; }
            .charbox { padding: 0.4rem 0.4rem 0.35rem; min-height: 10rem; }
            .charbox .card-top { gap: 0.4rem; }
            .charbox .charimg { width: 2.2rem; height: 2.9rem; }
            .charbox .card-name-group .name { font-size: 0.75rem; }
            .charbox .card-name-group .film-tag { font-size: 0.55rem; }
            .charbox .card-name-group .saga-tag { font-size: 0.5rem; padding: 0.025rem 0.4rem; }
            .charbox .card-details { font-size: 0.5rem; gap: 0.0625rem 0.2rem; }
            .charbox .card-details .detail-item .label { font-size: 0.45rem; }
            .charbox .card-details .detail-item .value { font-size: 0.45rem; max-width: 2.5rem; }
            .charbox .card-footer { font-size: 0.4rem; margin-top: 0.25rem; padding-top: 0.25rem; }
            .charbox .card-footer .id-tag { font-size: 0.4rem; }
            .search #searchInput { font-size: 0.75rem; height: 2.2rem; padding: 0.4rem 0.8rem; }
            .search #searchResultCount { font-size: 0.65rem; }
            .pagination button { font-size: 0.65rem !important; padding: 0.2rem 0.6rem !important; }
            .pagination .page-info { font-size: 0.65rem !important; }
        }

        ::-webkit-scrollbar { width: 0.3125rem; background: var(--bg-primary); }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 0.5rem; }
        ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

        /* 隐藏原有 .main 的默认 p 标签占位 */
        .main p {
            width: 100% !important;
            text-align: center !important;
            color: var(--text-dim) !important;
            padding: 2rem !important;
        }
    </style>
</head>
<body>

    <div class="left">
        <ul>
            <a href="../page/index.html"><li>首页</li></a>
            <a href="../page/timeline.html"><li>时间线</li></a>
            <a href="../page/introduce.html"><li>人物档案</li></a>
        </ul>
    </div>

    <!-- ============================================================
         史考特主容器
         ============================================================ -->
    <div class="scouter-container">

        <header class="scouter-header">
            <div class="scouter-brand">
                <div class="logo">DragonBallFilm <span>▸ 数据库</span></div>
                <div class="sub">人物档案</div>
            </div>
            <div class="scouter-status">
                <span class="stat-item"><span class="dot"></span><span class="label">系统</span><span class="value">在线</span></span>
                <span class="stat-item"><span class="label">目标</span><span class="value">地球</span></span>
                <span class="stat-item"><span class="label">扫描</span><span class="value">活跃</span></span>
                <span class="stat-item"><span class="label">档案</span><span class="value" id="totalCount">0</span></span>
            </div>
        </header>

        <!-- 搜索区域 -->
        <div class="search">
            <input type="text" id="searchInput" placeholder="搜索角色、影片、篇章、评价…" />
            <span id="searchResultCount">共 0 个角色</span>
        </div>

        <!-- 卡片容器 -->
        <div class="main" id="cardContainer"></div>

        <!-- 分页控件 -->
        <div class="pagination" id="paginationControls"></div>

        <footer class="scouter-footer">
            <div class="right">
                <span class="badge">● 实时</span>
                <span id="timeDisplay">--:--:--</span>
            </div>
        </footer>

    </div>

    <!-- ============================================================
         脚本区
         ============================================================ -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="../js/chardata.js"></script>
    <script src="../js/common.js"></script>

    <script>
        // ================================================================
        //  史考特 v5.2 · 支持返回时保留页码和搜索状态
        // ================================================================

        (function() {
            'use strict';

            const PAGE_SIZE = 10;
            let currentPage = 1;
            let filteredData = [];

            function getParam(name) {
                const params = new URLSearchParams(window.location.search);
                return params.get(name);
            }

            function truncate(text, maxLen) {
                if (!text) return '—';
                if (text.length <= maxLen) return text;
                return text.substring(0, maxLen) + '…';
            }

            function getColorForName(name) {
                const colors = [
                    '#F97316', '#1E3A5F', '#7C3AED', '#22C55E', '#D946EF',
                    '#3B82F6', '#EF4444', '#06B6D4', '#8B5CF6', '#EC4899',
                    '#F59E0B', '#FCD34D', '#34D399', '#60A5FA', '#F472B6'
                ];
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                return colors[Math.abs(hash) % colors.length];
            }

            function renderCards() {
                const totalItems = filteredData.length;
                const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;

                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * PAGE_SIZE;
                const end = Math.min(start + PAGE_SIZE, totalItems);
                const pageData = filteredData.slice(start, end);

                const $container = $('#cardContainer');
                $container.empty();

                if (pageData.length === 0) {
                    $container.html(`
                        <div class="empty-state">
                            <div class="icon">⟡</div>
                            <div>未匹配到任何角色</div>
                            <div style="font-size:0.85rem;margin-top:0.4rem;color:var(--text-dim);">尝试调整搜索关键词</div>
                        </div>
                    `);
                    updateCounts(totalItems);
                    renderPagination(totalPages);
                    return;
                }

                const fragment = document.createDocumentFragment();
                const searchTerm = $('#searchInput').val().trim();

                for (let i = 0; i < pageData.length; i++) {
                    const item = pageData[i];
                    const originalIndex = data.indexOf(item);

                    const briefAppraise = truncate(item.appraise || '—', 32);
                    const briefSituation = truncate(item.situation || '—', 18);
                    const briefFeelings = truncate(item.feelings || '—', 18);
                    const briefSaga = truncate(item.saga || '—', 20);

                    const card = document.createElement('div');
                    card.className = 'charbox';
                    card.dataset.index = originalIndex;
                    card.style.animationDelay = (i * 0.02) + 's';

                    card.innerHTML = `
                        <div class="card-top">
                            <div class="charimg">
                                <img src="${item.img}" alt="${item.charname}" onerror="this.src='../imgs/unknown.png'" />
                                <div class="ring"></div>
                            </div>
                            <div class="card-name-group">
                                <div class="name" title="${item.charname}">${item.charname}</div>
                                <div class="film-tag" title="${item.film || '—'}">${item.film || '—'}</div>
                                <span class="saga-tag" title="${item.saga || '—'}">${briefSaga}</span>
                            </div>
                        </div>
                        <div class="card-details">
                            <div class="detail-item"><span class="label">评价</span><span class="value" title="${item.appraise || '—'}">${briefAppraise}</span></div>
                            <div class="detail-item"><span class="label">状况</span><span class="value" title="${item.situation || '—'}">${briefSituation}</span></div>
                            <div class="detail-item"><span class="label">感受</span><span class="value" title="${item.feelings || '—'}">${briefFeelings}</span></div>
                            <div class="detail-item"><span class="label">篇章</span><span class="value" title="${item.saga || '—'}">${briefSaga}</span></div>
                        </div>
                        <div class="card-footer">
                            <div class="scan-tag"><span class="blink"></span>扫描中</div>
                            <span class="id-tag">#${String(originalIndex + 1).padStart(3, '0')}</span>
                        </div>
                    `;

                    // ★ 点击跳转：携带当前页码和搜索关键词
                    card.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        if (!isNaN(idx) && idx >= 0 && idx < data.length) {
                            let url = `profiledetails.html?index=${idx}&page=${currentPage}`;
                            if (searchTerm) {
                                url += `&search=${encodeURIComponent(searchTerm)}`;
                            }
                            window.location.href = url;
                        }
                    });

                    fragment.appendChild(card);
                }

                $container.append(fragment);
                updateCounts(totalItems);
                renderPagination(totalPages);
            }

            function updateCounts(totalItems) {
                $('#searchResultCount').text(`共 ${totalItems} 个角色（总计 ${data.length} 个）`);
                $('#totalCount').text(data.length);
            }

            function renderPagination(totalPages) {
                const $pagination = $('#paginationControls');
                $pagination.empty();
                if (totalPages <= 1) return;

                const prevDisabled = currentPage === 1;
                const prevBtn = $(`<button class="page-prev" ${prevDisabled ? 'disabled' : ''}>上一页</button>`);
                $pagination.append(prevBtn);

                const maxVisible = 5;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    const btn1 = $(`<button class="page-num" data-page="1">1</button>`);
                    $pagination.append(btn1);
                    if (startPage > 2) {
                        $pagination.append(`<span class="page-ellipsis">…</span>`);
                    }
                }

                for (let i = startPage; i <= endPage; i++) {
                    const activeClass = (i === currentPage) ? 'active-page' : '';
                    const btn = $(`<button class="page-num ${activeClass}" data-page="${i}">${i}</button>`);
                    $pagination.append(btn);
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) {
                        $pagination.append(`<span class="page-ellipsis">…</span>`);
                    }
                    const btnLast = $(`<button class="page-num" data-page="${totalPages}">${totalPages}</button>`);
                    $pagination.append(btnLast);
                }

                const nextDisabled = currentPage === totalPages;
                const nextBtn = $(`<button class="page-next" ${nextDisabled ? 'disabled' : ''}>下一页</button>`);
                $pagination.append(nextBtn);

                const info = $(`<span class="page-info">第 ${currentPage} / ${totalPages} 页</span>`);
                $pagination.append(info);

                $pagination.find('.page-prev').on('click', function() {
                    if (currentPage > 1) { currentPage--; renderCards(); }
                });
                $pagination.find('.page-next').on('click', function() {
                    if (currentPage < totalPages) { currentPage++; renderCards(); }
                });
                $pagination.find('.page-num').on('click', function() {
                    const page = parseInt($(this).data('page'), 10);
                    if (page !== currentPage) { currentPage = page; renderCards(); }
                });
            }

            function filterCards(keyword) {
                const trimmed = keyword.trim().toLowerCase();
                if (trimmed === '') {
                    filteredData = data.slice();
                } else {
                    filteredData = data.filter(item => {
                        const fullText = (
                            item.charname + ' ' +
                            item.film + ' ' +
                            item.chardetails + ' ' +
                            item.saga + ' ' +
                            item.appraise + ' ' +
                            item.situation + ' ' +
                            item.feelings
                        ).toLowerCase();
                        return fullText.includes(trimmed);
                    });
                }
                currentPage = 1;
                renderCards();
            }

            function updateClock() {
                const now = new Date();
                const time = now.toTimeString().split(' ')[0];
                $('#timeDisplay').text(time);
            }

            // ★ 初始化 —— 从 URL 恢复状态
            function initFromUrl() {
                const pageParam = getParam('page');
                const searchParam = getParam('search');

                if (searchParam !== null) {
                    const decoded = decodeURIComponent(searchParam);
                    $('#searchInput').val(decoded);
                    filterCards(decoded);
                } else {
                    filteredData = data.slice();
                }

                if (pageParam !== null) {
                    const page = parseInt(pageParam, 10);
                    if (!isNaN(page) && page > 0) {
                        currentPage = page;
                    }
                }

                renderCards();

                // 清除 URL 参数，避免刷新时重复应用
                if (window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }

            // ----- 启动 -----
            if (typeof data !== 'undefined' && Array.isArray(data) && data.length > 0) {
                filteredData = data.slice();
                initFromUrl();
                updateClock();
                setInterval(updateClock, 1000);

                $('#searchInput').on('input', function() {
                    filterCards(this.value);
                });

                console.log('⟡ SCOUTER v5.2 · 支持状态保持 ⟡');
                console.log('👾 已加载角色:', data.length, '位');
                console.log('📄 每页显示:', PAGE_SIZE, '个角色 (5×2)');
            } else {
                console.error('❌ 数据加载失败，请确保 chardata.js 已正确引用');
                $('#cardContainer').html(`
                    <div class="empty-state">
                        <div class="icon">⚠</div>
                        <div>数据加载失败</div>
                        <div style="font-size:0.85rem;margin-top:0.4rem;color:var(--text-dim);">请检查 chardata.js 是否存在</div>
                    </div>
                `);
            }

        })();
    </script>

</body>
</html>
