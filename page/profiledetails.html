<!DOCTYPE html>
<html lang="zh">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>dragon ball film · 角色详情</title>
		<link rel="stylesheet" href="../css/common.css" />
		<link rel="icon" href="../imgs/weblogo.png" type="image/png" />
		<link rel="stylesheet" href="../css/profiledetails.css" />
		<!-- 
			不再添加任何额外的内部样式，完全依赖您的外部 CSS 
			只通过下面 JavaScript 中的内联样式修正 h2 大小 
		-->
	</head>
	<body>
		<!-- ===== 顶部 ===== -->
		<header class="top">
			<a href="index.html" id="logo"><img src="../imgs/dbflogo.png" alt="" /></a>
			<div class="icons">
				<a href="https://space.bilibili.com/193386165" id="td" title="点击跳转bilibili">
					<span class="aura"><img src="../imgs/aura111.gif" alt="" /></span>
					<span id="avator"><img src="../imgs/sprite tiandao.png" alt="" /></span>
				</a>
				<p>视频建议:2871070425@qq.com</p>
				<a href="https://space.bilibili.com/439518462" id="rac" title="点击跳转bilibili">
					<span class="aura"><img src="../imgs/aura111.gif" alt="" /></span>
					<span id="avator"><img src="../imgs/sprite raccoon.png" alt="" /></span>
				</a>
				<p>网站建议:2733611989@qq.com</p>
			</div>
		</header>

		<!-- ===== 侧边栏 ===== -->
		<div class="left">
			<ul>
				<a href="../page/index.html"><li>首页</li></a>
				<a href="../page/timeline.html"><li>时间线</li></a>
				<a href="../page/introduce.html"><li>人物档案</li></a>
			</ul>
		</div>

		<!-- ===== 主内容 ===== -->
		<div class="main" id="mainContent">
			<!-- 由 JavaScript 动态渲染 -->
		</div>

		<!-- ===== 脚本 ===== -->
		<script src="https://code.jquery.com/jquery-3.6.0.min.js">
		</script>
		<script src="../js/common.js">
		</script>
		<script src="../js/chardata.js">
		</script>
		<script>
			// ================================================================
			//  1. 从 URL 获取 index 参数
			// ================================================================
			function getParam(name) {
				const params = new URLSearchParams(window.location.search);
				return params.get(name);
			}

			const indexParam = getParam('index');

			// ================================================================
			//  2. 根据索引从 data 数组中取角色数据
			// ================================================================
			let character = null;
			let validIndex = -1;

			if (indexParam !== null) {
				const idx = parseInt(indexParam, 10);
				if (!isNaN(idx) && idx >= 0 && idx < data.length) {
					character = data[idx];
					validIndex = idx;
				}
			}

			// ================================================================
			//  3. 渲染页面（只修改了 h2 的内联样式）
			// ================================================================
			const $main = $('#mainContent');

			if (character === null) {
				// ----- 未找到角色：显示友好提示 -----
				$main.html(`
					<div class="not-found">
						<p style="font-size:2.5rem; margin-bottom:0.5rem;">🔍</p>
						<p>未找到该角色，请返回 <a href="introduce.html">人物档案</a> 重新选择。</p>
						<p style="font-size:0.9rem; color:#aaa; margin-top:1rem;">（索引参数无效或数据缺失）</p>
					</div>
				`);
			} else {
				// ----- 正常渲染 -----
				// ★ 关键修改：给 h2 加上内联样式，控制字号和边距
				const rightTextHtml = `
					<h2 style="font-size:1.3rem; margin:0.2rem 0;">${character.film || '未知'}</h2>
					<h2 style="font-size:1.3rem; margin:0.2rem 0;">${character.charname || '未命名'}</h2>
					<p><strong>时期：</strong>${character.saga || '未知'}</p>
					<p><strong>现状：</strong>${character.situation || '未知'}</p>
					<p><strong>感受：</strong>${character.feelings || '未知'}</p>
					<p><strong>作者的评价：</strong>${character.appraise || '暂无'}</p>
				`;

				const avatarSrc = character.img || '';

				const html = `
					<div class="charprofile">
						<div class="avator">
							<img src="${avatarSrc}" alt="${character.charname || '角色'}" 
								 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22200%22%3E%3Crect width=%22180%22 height=%22200%22 fill=%22%23f0e4d8%22/%3E%3Ctext x=%2290%22 y=%22110%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23b08870%22%3E👤%3C/text%3E%3C/svg%3E'">
						</div>
						<div class="righttext">
							${rightTextHtml}
						</div>
					</div>
					<div class="details">
						<h2 style="font-size:1.3rem; margin:0 0 0.6rem 0;">人物简介</h2>
						<p id="chardetails">${character.chardetails || '暂无简介'}</p>
					</div>
				`;

				$main.html(html);

				console.log(`[profiledetails] 已加载角色：${character.charname} (索引 ${validIndex})`);
			}
		</script>
	</body>
</html>
